name: Docker

on:
  release:
    types: [published]
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ---------------------------------------------------------
      # ЭТАП 1: Сборка и минимальная проверка, что образ запускается
      # ---------------------------------------------------------
      - name: Build and Verify Launch
        run: |
          # Собираем production-образ
          docker build . --target production --tag inventree-test -f contrib/container/Dockerfile
          
          # Минимальная проверка: запускаем контейнер и выполняем базовые команды
          # Если образ "битый", эти команды завершатся с ошибкой и остановят workflow
          docker run --rm inventree-test invoke version
          docker run --rm inventree-test gunicorn --version
          
          echo "✅ Образ успешно собран и запускается."

      # ---------------------------------------------------------
      # ЭТАП 2: Публикация образа (пропускается в Pull Request)
      # ---------------------------------------------------------
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract Docker metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./contrib/container/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
