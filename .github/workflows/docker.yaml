name: Docker

on:
  release:
    types: [published]
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ---------------------------------------------------------
      # ЭТАП 1: Сборка и минимальная проверка запуска
      # ---------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Verify Launch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./contrib/container/Dockerfile
          target: production
          platforms: linux/amd64
          load: true
          tags: inventree-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image launches
        run: |
          docker run --rm inventree-test:latest invoke version
          docker run --rm inventree-test:latest gunicorn --version
          echo "✅ Образ успешно собран и запускается."

      # ---------------------------------------------------------
      # ЭТАП 2: Публикация образа (пропускается в Pull Request)
      # ---------------------------------------------------------
      - name: Log into registry ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract Docker metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./contrib/container/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
